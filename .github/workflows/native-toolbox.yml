name: Native toolbox
on:
  pull_request:
  push:
    branches: [main, native-toolbox]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENCODE_MCP_RUNTIME_DIR: ${{ runner.temp }}/opencode-native-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run setup:native
      - run: npm run typecheck:native
      - run: npm test
      - run: npm pack --dry-run
